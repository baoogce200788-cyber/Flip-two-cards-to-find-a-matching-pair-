<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Match Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    header {
      background: #0078d7;
      color: white;
      padding: 20px;
    }
    main {
      padding: 20px;
    }
    footer {
      background: #eee;
      padding: 10px;
      margin-top: 20px;
    }
    ul {
      text-align: left;
      display: inline-block;
      margin-top: 10px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 120px);
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }
    .card {
      width: 120px;
      height: 120px;
      background: #0078d7;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: white;
      position: relative;
      overflow: hidden;
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .card.flipped img {
      display: block;
    }
    .card.flipped span {
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Memory Match Game</h1>
    <p>Flip two cards to find a matching pair!</p>
  </header>

  <main>
    <h2>How to Play</h2>
    <ul>
      <li>Select two cards to flip.</li>
      <li>If they match, you keep the pair.</li>
      <li>The game ends when all pairs are found.</li>
    </ul>

    <div class="grid" id="game-board"></div>
  </main>

  <footer>
    <p>Images from <a href="https://www.pexels.com" target="_blank">Pexels</a> · © 2025 Memory Match Game</p>
  </footer>

  <script>
    const IMAGES = [
      "https://images.pexels.com/photos/414171/pexels-photo-414171.jpeg",
      "https://images.pexels.com/photos/147040/pexels-photo-147040.jpeg",
      "https://images.pexels.com/photos/257360/pexels-photo-257360.jpeg",
      "https://images.pexels.com/photos/34950/pexels-photo.jpg",
      "https://images.pexels.com/photos/238741/pexels-photo-238741.jpeg",
      "https://images.pexels.com/photos/462118/pexels-photo-462118.jpeg"
    ];

    let cards = [...IMAGES, ...IMAGES]; // duplicate to create pairs
    cards.sort(() => Math.random() - 0.5);

    const board = document.getElementById("game-board");

    let firstCard = null;
    let secondCard = null;
    let lockBoard = false;

    cards.forEach(src => {
      const card = document.createElement("div");
      card.classList.add("card");
      card.innerHTML = `<span>?</span><img src="${src}" alt="card image">`;
      board.appendChild(card);

      card.addEventListener("click", () => {
        if (lockBoard || card.classList.contains("flipped")) return;
        card.classList.add("flipped");

        if (!firstCard) {
          firstCard = card;
        } else {
          secondCard = card;
          lockBoard = true;

          if (firstCard.querySelector("img").src === secondCard.querySelector("img").src) {
            firstCard = null;
            secondCard = null;
            lockBoard = false;
          } else {
            setTimeout(() => {
              firstCard.classList.remove("flipped");
              secondCard.classList.remove("flipped");
              firstCard = null;
              secondCard = null;
              lockBoard = false;
            }, 1000);
          }
        }
      });
    });
  </script>
</body>
</html>
